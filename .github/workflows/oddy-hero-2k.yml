name: Install ODDY high-quality original-source 2K image

on:
  push:
    paths:
      - ".github/workflows/oddy-hero-2k.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and install original-source 2K photo
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          folder=Path('.oddy-staging')
          paths=sorted(folder.glob('part-*.txt'))
          if len(paths)!=22:
              raise SystemExit(f'Expected 22 image fragments, found {len(paths)}')
          data=base64.b64decode(''.join(p.read_text() for p in paths),validate=True)
          if hashlib.sha256(data).hexdigest() != '5b561b5543032a89abd75b48f011c36807914fa9b56fbb474865de1ea30f3a27':
              raise SystemExit('High-resolution photo transfer hash mismatch')
          img=Image.open(BytesIO(data))
          if img.size != (1365, 2048) or img.format != 'WEBP':
              raise SystemExit(f'Unexpected photo format or dimensions: {img.size}, {img.format}')
          out=Path('assets/oddy-fashion-hero.webp')
          out.write_bytes(data)
          print(f'Installed 2K original-source hero: {img.size}, {len(data)} bytes')
          PY
      - name: Commit photo and remove temporary transfer fragments
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/oddy-fashion-hero.webp
          git rm -r .oddy-staging
          git commit -m "Replace low-quality hero upscale with source-quality 2K photo"
          git push
